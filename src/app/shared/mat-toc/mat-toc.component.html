<mat-card class="mat-toc">
  <h3 class="mat-toc-title" *ngIf="title">{{ title }}</h3>

  <mat-nav-list>
    <mat-list-item *ngFor="let item of items" [activated]="activeLink === item.link" (click)="scrollTo(item.link, $event)">
      <a class="toc-link" [href]="item.link">{{ item.label }}</a>
    </mat-list-item>
  </mat-nav-list>
</mat-card>
